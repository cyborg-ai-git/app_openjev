[package]
name = "app_openjev"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Ratatui workbench and typed Rust client for TypeSafe AI / Jev"
license = "Apache-2.0"
default-run = "openjev"

[lib]
name = "openjev"

[[bin]]
name = "openjev"
path = "src/main.rs"

[[bin]]
name = "openjev-model"
path = "src/bin/openjev_model.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
log = "0.4"
toml = "0.8"
evo_framework = { git = "https://github.com/cyborg-ai-git/evo_framework.git" }
evo_core_entity = { git = "https://github.com/cyborg-ai-git/evo_core_entity.git" }
evo_core_env = { git = "https://github.com/cyborg-ai-git/evo_core_env.git" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
candle-metal-kernels = { version = "0.9", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }

[features]
default = []
local = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
metal = ["local", "candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels"]
cuda = ["local", "candle-core/cuda", "candle-nn/cuda"]

[dev-dependencies]
wiremock = "0.6"
criterion = "0.8"
tempfile = "3"

[[bench]]
name = "bench_openjev_decision"
harness = false

[[bench]]
name = "bench_openjev_local_inference"
harness = false
required-features = ["local"]

[[bench]]
name = "bench_openjev_remote_comparison"
harness = false
required-features = ["local"]

[[bench]]
name = "bench_openjev_official_examples"
harness = false
required-features = ["local"]

[workspace]
